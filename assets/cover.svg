<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120" role="img" aria-label="雅思阅读的领域语言 封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="65%" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1120" fill="url(#bg)"/>
  <rect width="800" height="1120" fill="url(#halo)"/>

  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="76" y1="0" x2="76" y2="1120"/>
    <line x1="724" y1="0" x2="724" y2="1120"/>
    <line x1="0" y1="92" x2="800" y2="92"/>
    <line x1="0" y1="1028" x2="800" y2="1028"/>
  </g>

  <text x="76" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" letter-spacing="3">DOMAIN LANGUAGE FOR IELTS ACADEMIC READING</text>
  <rect x="76" y="92" width="180" height="3.5" rx="1.75" fill="url(#accent)"/>

  <text x="76" y="190" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="64" font-weight="800">雅思阅读的领域语言</text>
  <text x="76" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="500">在雅思主题范围内学习世界如何被英语表达</text>
  <text x="76" y="282" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600">15 Topic Worlds · Meaning Networks · Causal Chains · Evidence Standards</text>

  <!-- 5 Topic World Part Cards (Cleanly spaced, zero overlap) -->
  <g transform="translate(76, 338)">
    <rect x="0" y="0" width="648" height="96" rx="12" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="24" y="34" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PART I · READING INFRASTRUCTURE</text>
    <text x="624" y="34" text-anchor="end" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="700">Ch 01</text>
    <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700">主题世界 · 意义网络 · 领域语言与心智模型</text>

    <rect x="0" y="114" width="648" height="96" rx="12" fill="#0f172a" fill-opacity="0.82" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="24" y="148" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PART II · SCIENCE, NATURE &amp; ENVIRONMENT</text>
    <text x="624" y="148" text-anchor="end" fill="#99f6e4" font-family="monospace" font-size="13" font-weight="700">Ch 02–05</text>
    <text x="24" y="184" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700">科学探究与证据 · 生态系统 · 生命适应 · 气候能源</text>

    <rect x="0" y="228" width="648" height="96" rx="12" fill="#0f172a" fill-opacity="0.82" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="24" y="262" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PART III · HUMANS, LEARNING &amp; HEALTH</text>
    <text x="624" y="262" text-anchor="end" fill="#ddd6fe" font-family="monospace" font-size="13" font-weight="700">Ch 06–08</text>
    <text x="24" y="298" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700">学习教育 · 心理行为与决策 · 健康风险与公共证据</text>

    <rect x="0" y="342" width="648" height="96" rx="12" fill="#0f172a" fill-opacity="0.82" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="24" y="376" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PART IV · SOCIETY, ECONOMY &amp; SPACE</text>
    <text x="624" y="376" text-anchor="end" fill="#fde68a" font-family="monospace" font-size="13" font-weight="700">Ch 09–12</text>
    <text x="24" y="412" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700">资源市场 · 工作技能 · 城市基建 · 农业与粮食系统</text>

    <rect x="0" y="456" width="648" height="96" rx="12" fill="#0f172a" fill-opacity="0.82" stroke="#fb7185" stroke-width="1.8"/>
    <text x="24" y="490" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PART V · TECHNOLOGY, HISTORY &amp; CULTURE</text>
    <text x="624" y="490" text-anchor="end" fill="#fecdd3" font-family="monospace" font-size="13" font-weight="700">Ch 13–15</text>
    <text x="24" y="526" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700">技术创新 · 历史考古与解释 · 媒体设计与文化表达</text>
  </g>

  <text x="76" y="988" fill="#94a3b8" font-family="Georgia, serif" font-style="italic" font-size="18">"Reading grows from understanding how a domain talks about the world."</text>
  <text x="76" y="1068" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700">LIN.MI</text>
  <text x="724" y="1068" text-anchor="end" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">32 INTERACTIVE READING LABS</text>
</svg>
